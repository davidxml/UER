<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile app viewport: edge-to-edge, no pinch/double-tap zoom -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>UER</title>
    <meta
      name="description"
      content="UNILAG Emergency Response — report campus emergencies and get routed instantly to medical, fire, or security teams."
    />

    <!-- Brand chrome: cream page with wine accents, matching SplashScreen -->
    <meta name="theme-color" content="#FDFBF7" />
    <meta name="color-scheme" content="light" />

    <!-- Standalone (installed) app behaviour -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UER" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Painted before the JS bundle and index.css arrive, so the very first frame
      is already the SplashScreen's cream (#FDFBF7) instead of a white flash.
    -->
    <style>
      html {
        height: 100%;
        background-color: #fdfbf7;
      }
      body {
        margin: 0;
        min-height: 100%;
        background-color: #fdfbf7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
