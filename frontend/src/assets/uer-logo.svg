<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The transform attribute centers the drawing.
    stroke="#911634" applies the solid wine color to all lines.
    stroke-width="3" gives the orbital paths a thick, solid presence.
  -->
  <g transform="translate(50,50)" fill="none" stroke="#911634" stroke-width="3" stroke-linecap="round">
    <!-- First Orbit (horizontal orientation) -->
    <ellipse rx="35" ry="14" />

    <!-- Second Orbit (rotated 60 degrees) -->
    <ellipse rx="35" ry="14" transform="rotate(60)" />

    <!-- Third Orbit (rotated 120 degrees) -->
    <ellipse rx="35" ry="14" transform="rotate(120)" />
  </g>
</svg>
