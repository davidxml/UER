# Test configuration: isolated H2 database + required app properties.
# Keeps @SpringBootTest context-load tests runnable in CI without external services.

spring.datasource.url=jdbc:h2:mem:uertest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# schema.sql is Postgres-oriented; let Hibernate create the test schema instead.
spring.sql.init.mode=never

# Required by beans during context startup.
uer.jwt.secret=test-secret-key-that-is-long-enough-for-hs256!!
uer.jwt.ttl-ms=300000
uer.refresh.student-ttl-ms=1209600000
uer.refresh.staff-ttl-ms=64800000
uer.security.bcrypt-strength=4
uer.security.max-failed-logins=5
uer.security.lockout-minutes=15
uer.student-directory.provider=manual
uer.cors.origins=http://localhost:5173,http://localhost:5174

spring.docker.compose.enabled=false
