spring.application.name=uer

# Server — Render injects PORT; fall back to 8080 locally
server.port=${PORT:8080}

# Origins allowed for CORS (REST) and the SockJS /ws endpoint. Localhost by
# default; override with CORS_ORIGINS (comma-separated) on the deploy host,
# e.g. https://uer-reporters.vercel.app,https://uer-responders.vercel.app
uer.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Delays custom SQL scripts (like data.sql) until after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

# Run schema.sql against the Supabase Postgres instance (not just embedded DBs)
spring.sql.init.mode=always

# Database Connection
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.iucvvrsxqnnotixhfiim
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Auth — signing key (32+ chars, from .env) and the shared responder PIN stub
uer.jwt.secret=${JWT_SECRET}
uer.jwt.ttl-ms=86400000
uer.responder-pin=${RESPONDER_PIN:1234}