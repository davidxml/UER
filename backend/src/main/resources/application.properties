spring.application.name=uer

# Server — Render injects PORT; fall back to 8080 locally
server.port=${PORT:8080}

# Origins allowed for CORS (REST) and the SockJS /ws endpoint. Localhost by
# default (reporter :5173 + responder :5174 dev servers); override with
# CORS_ORIGINS (comma-separated) on the deploy host,
# e.g. https://uer-reporters.vercel.app,https://uer-responders.vercel.app
uer.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Run schema.sql against the Supabase Postgres instance (not just embedded DBs).
# Deliberately NOT deferred: schema.sql must create the tables first so its
# CHECK constraints and foreign keys are applied. Hibernate then only adds
# anything new via ddl-auto=update.
spring.sql.init.mode=always

# Database Connection
# prepareThreshold=0 disables server-side prepared statements: Supabase's
# transaction-mode pooler (port 6543) routes each transaction to a different
# Postgres backend, so Hibernate's cached "S_1/S_2..." server-side statements
# collide ("prepared statement ... already exists / does not exist") and the
# API 500s intermittently.
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.iucvvrsxqnnotixhfiim
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari pool tuning for Supabase's transaction-mode pooler (port 6543):
# the pooler closes idle connections well before Hikari's 30-min default
# maxLifetime, causing "Failed to validate connection ... has been closed"
# warnings. Retire connections sooner and keep them alive instead.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Auth — signing key (32+ chars, from .env) and short-lived access tokens.
# Access tokens live 5 minutes; sessions are extended with rotating refresh
# tokens (students 14 days, staff 18 hours = one shift).
uer.jwt.secret=${JWT_SECRET}
uer.jwt.ttl-ms=300000
uer.refresh.student-ttl-ms=1209600000
uer.refresh.staff-ttl-ms=64800000

# Login protection and password hashing.
uer.security.bcrypt-strength=12
uer.security.max-failed-logins=5
uer.security.lockout-minutes=15

# Student directory integration. "manual" = collect + verify by admin until the
# university grants API access.
uer.student-directory.provider=manual