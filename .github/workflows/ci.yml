name: CI

on:
  push:
    branches: [main, development, "feat/**"]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        # UerApplicationTests is a full @SpringBootTest context load that requires
        # external DB/JWT config. Excluded until a CI test profile (e.g. H2/Testcontainers)
        # is added. The auth unit tests still run.
        run: ./mvnw -B test -Dtest='!UerApplicationTests'

      - name: Build (skip tests already run)
        run: ./mvnw -B package -DskipTests

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build reporter
        run: npm run build

      - name: Build responder
        run: npm run build:responder
