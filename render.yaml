# Render blueprint for the UER Spring Boot backend.
#
# Deploy: connect the GitHub repo, and Render reads this file to create the
# Web Service automatically. Secrets are NOT stored here — the `sync: false`
# env vars are fill-in placeholders you set in the Render dashboard (or via
# the CLI with --from-schema).
#
# Local dev is unaffected by this file: with no CORS_ORIGINS/PORT set the
# backend falls back to localhost:5173 and port 8080 (see application.properties).
services:
  - type: web
    name: uer-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/incidents
    envVars:
      # Fit the JVM heap inside the free instance's 512MB RAM.
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60"
      # Supabase Postgres password (kept secret — set in dashboards)
      - key: DB_PASSWORD
        sync: false
      # JWT signing secret (32+ chars — values already used locally)
      - key: JWT_SECRET
        sync: false
      # Shared responder PIN for the demo (default "1234" if unset)
      - key: RESPONDER_PIN
        sync: false
      # Allowed browser origins, comma-separated:
      #   e.g. https://uer-reporters.vercel.app,https://uer-responders.vercel.app
      - key: CORS_ORIGINS
        sync: false